mygraph:
  - src_stem: 'somesubdir/foo'
    dest_stem: 'bar'
    title: 'My Title'
    backend: "matplotlib"

    # The type of graph. Must be 'confusion_matrix'.
    type: 'confusion_matrix'

    # The column containing ground truth labels. Optional. Defaults to 'truth'
    # if omitted.
    truth_col: 'My truth'

    # The column containing predicted labels. Optional. Defaults to 'predicted'
    # if omitted.
    predicted_col: 'My Predictions'

    # Should the X labels be rotated? Helpful if you have long category
    # names. Defaults to False if omitted.
    xlabels_rotate: False
