mycategory:
  - src_stem: 'somesubdir/foo'
    backend: "matplotlib"
    title: 'My Title'
    dest_stem: 'bar'

    # The type of graph. Must be 'histogram'.
    type: 'scatterplot'

    # Name of the source column to use for the X values. Defaults to 'xcol' if
    # omitted.
    xcol: myxcol

    # Name of the source column to use for the Y values. Defaults to 'ycol' if
    # omitted.
    ycol: myycol

    # X-axis label. Defaults to 'xcol'.
    xlabel: My X label

    # Y-axis label. Defaults to 'ycol'.
    ylabel: My Y label

    # Whether to overlay a curve of best fit on the scatterplot. Defaults to
    # false.
    show_best_fit: false

    # The kind of fit to overlay when ``show_best_fit`` is ``true``. One of
    # ``linear``, ``quadratic``, ``cubic``, ``log``, or ``exp``. The fitted
    # equation and its R\ :sup:`2` value are appended to the graph title.
    # Ignored when ``show_best_fit`` is ``false``.
    best_fit_kind: linear
