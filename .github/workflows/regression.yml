name: Regression (shape + value)

on:
  workflow_call:

jobs:
  regression:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - 3.9
          - 3.12

        container:
          - jharwell/ubuntu24.04-sierra:latest

        slice:
          - name: shape
            tags: "regression and shape"
          - name: value
            tags: "regression and value"

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sample-project-setup
        with:
          engine: jsonsim

      - name: Run nox (regression ${{ matrix.slice.name }})
        env:
          PYTEST_ADDOPTS: "--mpl-results-path=mpl-results --mpl-generate-summary=html"
          # 2026-09-29 [JRH]: These are necessary to get deterministic
          # renderings of some nx graphs.
          OPENBLAS_CORETYPE: Haswell
          OPENBLAS_NUM_THREADS: "1"
        run: |
          uv run nox -p ${{ matrix.python-version }} -k "${{ matrix.slice.tags }}"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mpl-results-${{ matrix.slice.name }}-${{ matrix.python-version }}
          path: mpl-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: ci-regression-${{ matrix.slice.name }}-${{ matrix.python-version }}-coverage
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
