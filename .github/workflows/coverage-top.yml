name: Smoke Coverage Top-level

# Run:
#
# - Every month. Scheduling helps keep drift/issues with updates to runners
#   at bay.
# - On pushes to source/CI (runs tests + coverage; on devel, publishes a
#   .devN build to TestPyPI).
# - On pushing a vX.Y.Z tag (cuts a stable GitHub release -> triggers
#   publish.yml -> PyPI). See "Cutting a stable release" below.
#
# Cutting a stable release (manual):
#   git checkout master && git pull
#   git tag -a v1.5.16 -m "Release v1.5.16"
#   git push origin v1.5.16
# hatch-vcs reads the tag and builds exactly 1.5.16; the release job tags the
# GitHub release to match.
on:
  push:
    paths:
      - 'sierra/**'
      - '.github/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  schedule:
    - cron: '0 0 1 * *'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-presence:
    uses: ./.github/workflows/smoke-presence.yml
    secrets: inherit

  regression:
    uses: ./.github/workflows/regression.yml
    secrets: inherit

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  coverage:
    runs-on: ubuntu-latest
    container: jharwell/ubuntu24.04-sierra:latest

    needs:
      - smoke-presence
      - regression
      - unit-tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate coverage report
        shell: bash
        run: |
          # This is necessary for coverage since we run all integration tests in
          # nox, otherwise coverage can't find e.g., the sierra-cli executable
          # and we can't upload coverage.
          uv sync --group dev
          source .venv/bin/activate

          which sierra-cli
          sierra-cli --version
          which coverage
          which nox
          pwd

          coverage \
            combine \
            --debug=pathmap \
            $(find . -name "ci-*-coverage*")

          coverage \
            report \
            --ignore-errors \
            --fail-under=80

          coverage \
            xml \
            --ignore-errors

      - uses: actions/upload-artifact@v4
        with:
          name: ci-integration-coverage-xml
          path: coverage.xml

      - name: Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

        run: |
          git config --global --add safe.directory ${{ github.workspace}}
          uv run -p 3.9 coveralls

  create-release:
    runs-on: ubuntu-latest
    container: jharwell/ubuntu24.04-sierra:latest

    needs:
      - coverage

    # softprops/action-gh-release creates the stable GitHub release on tag push.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git history + tags. The default
          # shallow clone (fetch-depth: 1) strips tags and commit distance,
          # which makes hatch-vcs fall back to 0.1.dev0. Full history is required.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate manpages
        shell: bash
        run: |
          uv sync -p 3.12 --group dev

          # Hatch only picks up manpages via shared-data if they live INSIDE a
          # package directory. We don't commit them to source control, so we
          # generate and copy them in CI here.
          mkdir -p sierra/data/man
          cd docs && uv run -p 3.12 sphinx-build -b man . _build/man
          cp docs/_build/man/*.1 sierra/data/man/

          # Build the package and verify manpages were included. hatch-vcs
          # stamps the version from git here
          uv build && python3 -m zipfile -l dist/sierra_research-*.whl | grep man

      # Hand the built dist to the container-less publish job below. The
      # pypi-publish action is NOT supported inside a `container:` job, so the
      # actual TestPyPI upload happens in a dependent job which doesn't use a
      # container.
      - uses: actions/upload-artifact@v4
        with:
          name: sierra-release-dist
          path: dist/
          retention-days: 14

      # --- Stable release ------------------------------------------------------
      #
      # hatch-vcs computes the version from git tags.
      #
      #   - On devel (branch push): the build above produced X.Y.(Z+1).devN,
      #     published to TestPyPI by the publish-dev-testpypi job. No git tag,
      #     no GitHub release.
      #
      #   - On a vX.Y.Z tag push: the build produced exactly X.Y.Z (the tag IS
      #     the version). We create a GitHub release tagged vX.Y.Z, which (being
      #     'published') triggers publish.yml -> PyPI.
      #
      - name: Github release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # NOTE: intentionally NOT secrets.GITHUB_TOKEN. A workflow can't
          # trigger another workflow (publish.yml) using the token it was itself
          # triggered with. BOT_RELEASE_TOKEN is a fine-grained PAT scoped to
          # this repo whose 'published' event DOES trigger publish.yml.
          token: ${{ secrets.BOT_RELEASE_TOKEN }}
          # The tag already exists (you pushed it); reuse it, don't recreate.
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: false
          files: dist/*

  # Publish dev (.devN) builds to TestPyPI.
  publish-dev-testpypi:
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    needs:
      - create-release

    environment: testpypi

    permissions:
      id-token: write   # mandatory for Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sierra-release-dist
          path: dist

      - name: Publish dev build to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
