name: Coverage Top-level

# Run:
#
# - On pushes to ANY branch, filtered to commits touching sierra/** or
#   .github/**
#
# - Every month, to catch drift from runner/image updates.
#
# Releases are handled by a SEPARATE workflow (release.yml), triggered on
# vX.Y.Z tag pushes. `paths` and `tags` cannot coexact correctly in one push
# event (a `paths` filter also applies to tag pushes and would silently skip
# releases), which is why releasing lives in its own file.
#
# Cutting a stable release (manual):
#   git checkout master && git pull
#   git tag -a v1.5.16 -m "Release v1.5.16"
#   git push origin v1.5.16
# hatch-vcs reads the tag and builds exactly 1.5.16; the release job tags the
# GitHub release to match.
on:
  push:
    paths:
      - 'sierra/**'
      - '.github/**'

  schedule:
    - cron: '0 0 1 * *'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    uses: ./.github/workflows/smoke-presence.yml
    secrets: inherit

  regression-tests:
    uses: ./.github/workflows/regression.yml
    secrets: inherit

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  coverage:
    runs-on: ubuntu-latest
    container: jharwell/ubuntu24.04-sierra:latest

    needs:
      - smoke-tests
      - regression-tests
      - unit-tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate coverage report
        shell: bash
        run: |
          # This is necessary for coverage since we run all integration tests in
          # nox, otherwise coverage can't find e.g., the sierra-cli executable
          # and we can't upload coverage.
          uv sync --group dev
          source .venv/bin/activate

          which sierra-cli
          sierra-cli --version
          which coverage
          which nox
          pwd

          coverage \
            combine \
            --debug=pathmap \
            $(find . -name "ci-*-coverage*")

          coverage \
            report \
            --ignore-errors \
            --fail-under=80

          coverage \
            xml \
            --ignore-errors

      - uses: actions/upload-artifact@v4
        with:
          name: ci-integration-coverage-xml
          path: coverage.xml

      - name: Coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

        run: |
          git config --global --add safe.directory ${{ github.workspace}}
          uv run coveralls

  # Build the .devN distribution and hand it to the TestPyPI publish job.
  # Gated to devel: feature branches run tests/coverage above, but only devel
  # produces a published dev build. Stable releases are built in release.yml.
  build-dist:
    if: github.ref == 'refs/heads/devel'
    runs-on: ubuntu-latest
    container: jharwell/ubuntu24.04-sierra:latest

    needs:
      - coverage

    # softprops/action-gh-release creates the stable GitHub release on tag push.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs derives the version from git history + tags. The default
          # shallow clone (fetch-depth: 1) strips tags and commit distance,
          # which makes hatch-vcs fall back to 0.1.dev0. Full history is required.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Generate manpages
        shell: bash
        run: |
          uv sync -p 3.12 --group dev

          # Hatch only picks up manpages via shared-data if they live INSIDE a
          # package directory. We don't commit them to source control, so we
          # generate and copy them in CI here.
          mkdir -p sierra/data/man
          cd docs && uv run -p 3.12 sphinx-build -b man . _build/man
          cp docs/_build/man/*.1 sierra/data/man/

          # Build the package and verify manpages were included. hatch-vcs
          # stamps the version from git here
          uv build && python3 -m zipfile -l dist/sierra_research-*.whl | grep man

      # Hand the built dist to the container-less publish job below. The
      # pypi-publish action is NOT supported inside a `container:` job, so the
      # actual TestPyPI upload happens in a dependent job which doesn't use a
      # container.
      - uses: actions/upload-artifact@v4
        with:
          name: sierra-dev-dist
          path: dist/
          retention-days: 14

  # Publish dev (.devN) builds to TestPyPI. Separate, container-LESS job:
  # pypa/gh-action-pypi-publish is unsupported inside a `container:` job, and
  # keeping publish separate from build is the recommended security posture for
  # Trusted Publishing.
  publish-dev-testpypi:
    runs-on: ubuntu-latest
    needs:
      - build-dist

    environment: testpypi

    permissions:
      id-token: write   # mandatory for Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sierra-dev-dist
          path: dist

      - name: Publish dev build to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
