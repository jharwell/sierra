[project]
name = "sierra-research"

################################################################################
# Version is derived from git tags by hatch-vcs (see [tool.hatch.version]).
#   - Stable tag  vX.Y.Z        -> version X.Y.Z
#   - Untagged commits after it -> X.Y.(Z+1).devN  (N = commits since the tag)
# There is deliberately no hardcoded version string here anymore.
################################################################################
dynamic = ["version"]

description = "Automation framework for the scientific method in R&D"
authors = [
    {name= "John Harwell", email = "john.r.harwell@gmail.com"},
]
dependencies = [
    "holoviews",
    # 2026-07-07 [JRH]: matplotlib 3.11.0 is incompatible with holoviews 1.23
    # and later. Presumably holoviews will fix its mpl 3.11 support
    # eventually. Right now, downgrading is the only fix. And, since SIERRA
    # still supports python 3.9, we can't just pin to <3.11.0, because that is
    # python3.10+ only. So the fix is in two stages, only one of which I control.
    "matplotlib >=3.9.0, <3.10.0",
    "hvplot",
    "coloredlogs",
    "distro",
    "networkx",
    "certifi",
    "haggis",
    "implements",
    "jsonpath-ng",
    "yamlpath",
    "ruamel.yaml",
    "pygraphviz",
    # 2025-11-24 [JRH]: Causes errors of the form: np.unicode_ was
    # removed in the NumPy 2.0 release. Use np.str_ instead.
    #
    # When saving hv network plots. This should eventually be removed
    # so we can use the latest and greatest numpy. Eventually.
    "numpy<2.0",
    "polars",
    "pyarrow",
    "prefect",
    "prefect[docker]",
    "psutil",
    "pyyaml",
    "retry",
    "strictyaml",
    "sympy",
]

requires-python = ">=3.9"
readme = "README.rst"
license = {file = "LICENSE"}
keywords = ["research", "automation", "robotics", "parameter sweeps",
            "agent-based modeling", "reproducibility", "reusability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]


[dependency-groups]
analysis = [
    'pylint',
    'pytype',
    'pydocstyle',
    'xenon',
    'flake8',
    'ruff',
    'mypy',
    'types-psutil',
    'types-networkx',
]

ci = [
    'nox',
    'psutil',
    'pytest',
    'pytest-cov',
    'pytest-mpl',
    'xmldiff',
    'jsondiff',
    "deepdiff",
    'coverage',
    'coveralls',
    'pyproject-parser[cli]',
    'coveralls'
]

docs = [
    "psutil",
    "graphviz",
    "toml",
    "docutils",
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-argparse-cli",
    "sphinx-copybutton",
    "sphinxcontrib-napoleon",
    "sphinxcontrib-video",
    "sphinx-autobuild",
    "sphinxcontrib-plantuml",
    "sphinx-design",
    "sphinx-last-updated-by-git",
    "sphinx-autoapi"
]
dev = [
    {include-group ="docs"},
    {include-group ="analysis"},
    {include-group ="ci"},
]

[project.urls]
Homepage = "https://github.com/jharwell/sierra"

[project.scripts]
# Leave this in until SIERRA 2.0
sierra-cli = "sierra.main:main_deprecated"
sierra = "sierra.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version is computed from git tags at build time.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Untagged commits after stable vX.Y.Z build as X.Y.(Z+1).devN, matching the
# old bump-version.sh semantics (dev stream targets the next patch).
version_scheme = "guess-next-dev"
# Strip the +gHASH local segment. PyPI/TestPyPI REJECT local-version segments
# on upload, so this is required for .devN uploads from CI to succeed.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
include = ["sierra"]

# There should be a way to do this an the directory level with
# excludes, but there doesn't seem to be, so listing out each man page
# is required in order to avoid installing some of the artifacts
# sphinx generates when building man pages.
#
# BUT, doing it this way also causes a bootstrapping problem, because
# you can't install SIERRA without building the docs, and you can't do
# that with uv until you install SIERRA. So we punt for now, and
# modify this file in CI to generate the man pages as needed.
[tool.hatch.build.targets.wheel.shared-data]
"sierra/data/man/sierra.1" = "share/man/man7/sierra.1"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
# File discovery and exclusions
extend-exclude = [
]

# Line length and formatting
line-length = 100
indent-width = 4

# Python version
target-version = "py39"

[tool.ruff.lint]
# Enable comprehensive rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    # "I",      # isort. Disabled for now because it messes with the
    # nice ordering already in place.
    "N",      # pep8-naming
    "PL",     # pylint
    "C90",    # mccabe complexity
    "UP",     # pyupgrade (modernization)
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "C4",     # flake8-comprehensions
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    # "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PD",     # pandas-vet
    "PGH",    # pygrep-hooks
    "FLY",    # flynt (string formatting)
    "PERF",   # perflint (performance)
    "RUF",    # ruff-specific rules
]

# Disable rules based on your pylintrc
ignore = [
    "E501",      # line-too-long (handled by formatter)
    "D",         # pydocstyle (missing-function-docstring was disabled)
    "ARG001",    # unused-function-argument (was unused-argument)
    "F401",      # unused-import
    "PLR0904",   # too-many-public-methods (more lenient in modern code)
    "PLR2004",   # Magic numbers
    "PERF203",   # Using try-catch inside a loop
    "COM812",    # trailing-comma (conflicts with formatter)
    "ISC001",    # implicit-str-concat (conflicts with formatter),
    "UP032",     # f-string (convert to f-strings)
    "N806",      # Variable in function should be lowercase (allows X, Y, etc.)
    "N803",      # Argument name should be lowercase (allows q, bc, etc.)
]

# Allow auto-fixing for all enabled rules
fixable = ["ALL"]
unfixable = []

# Per-file ignores (if needed)
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.lint.pylint]
# Design limits from your DESIGN section
max-args = 7
max-branches = 12
max-returns = 7
max-statements = 50
max-locals = 15
# max-attributes = 10
max-bool-expr = 5
max-public-methods = 20
max-nested-blocks = 5

# Module limits
# max-module-lines = 1500

[tool.ruff.lint.mccabe]
# Complexity threshold
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
# String quote consistency (from your STRING section)
inline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.flake8-builtins]
# Allow certain redefined builtins if needed
builtins-ignorelist = []

[tool.ruff.lint.pep8-naming]
# Naming conventions from your BASIC section
# Most of your naming rules are already covered by default

# Allow specific variable names (your good-names)
[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
# Formatting configuration
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Respect magic trailing commas
docstring-code-format = true
docstring-code-line-length = 80

[tool.pytype]
# 2025-11-20 [JRH]: Because the logging.trace() callings get flagged
# otherwise. This is terrible because it can hide some true positives,
# but I cannot get the typeshed/stub stuff to work for pytype.
disable= ["module-attr", "attribute-error"]

[tool.mypy]
files = ["sierra/plugins"]

# --- Strictness flags ---
# Untyped call sites and defs are errors; incomplete signatures too.
# disallow_untyped_calls = true
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# Type-check bodies of functions that lack annotations.
check_untyped_defs = true

# Returning Any from a function declared to return something concrete.
# warn_return_any = true
# Flag code mypy proves is unreachable.
warn_unreachable = true
# Flag casts that don't change the type.
warn_redundant_casts = true
# Flag '# type: ignore' comments that no longer suppress anything.
warn_unused_ignores = true

# --- Error codes off by default, enabled here ---
enable_error_code = [
    # Comparisons/conditions whose result is statically known.
    "redundant-expr",
    # 'if some_bool_returning_func:' — the function, not its call.
    "truthy-bool",
]

# --- Error codes deliberately disabled --- Attribute and argument checking is
# too noisy against the current codebase; drop entries from this list as the
# annotations get cleaned up.
disable_error_code = [
    "attr-defined",
]

# --- Third-party libraries without stubs ---
[[tool.mypy.overrides]]
module = [
    "holoviews.*",
    "polars.*",
    "matplotlib.*",
    "strictyaml.*",
    "coloredlogs.*",
    "haggis.*",
    # 2026-07-26 [JRH]: This can be removed once I move up to a more recent
    # version of python; installing types-PyYAML doesn't work when the min
    # python version is 3.9.
    "yaml.*",
    "yamlpath.*",
    "jsonpath_ng.*",
    "retry.*"]
ignore_missing_imports = true
