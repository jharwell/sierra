# SLURM cgroup configuration.
#
# Install at /etc/slurm/cgroup.conf (same dir as slurm.conf).
#
# Why this file exists:
#   slurmd (SLURM 23.11) initializes a cgroup context at startup regardless of
#   ProctrackType/TaskPlugin. Its cgroup/v2 plugin normally creates the
#   slurmstepd scope via dbus + systemd; in a container with no systemd as PID 1
#   that scope creation fails ("_init_new_scope_dbus ... could not be set" ->
#   "cannot create cgroup context for cgroup/v2" -> "slurmd initialization
#   failed"), the node never registers, and sbatch --wait hangs / never runs.
#
#   IgnoreSystemd=yes tells the cgroup/v2 plugin to manage the cgroup hierarchy
#   DIRECTLY via cgroupfs, bypassing dbus/systemd -- the supported way to run
#   cgroup/v2 in a container without systemd. This is the actual failing step;
#   removing systemd from the path is what fixes it.
#
#   NOTE: do NOT use `CgroupPlugin=disabled` -- this build has no such plugin
#   ("cannot find cgroup plugin for disabled"). autodetect keeps the real v2
#   plugin; IgnoreSystemd removes the systemd dependency.
#
# Verify the accepted directives for THIS build:
#   ls /usr/lib/x86_64-linux-gnu/slurm-wlm/ | grep cgroup   # plugins present
#   man cgroup.conf | grep -A3 IgnoreSystemd                # option exists?
#   slurmd -Dvvv 2>&1 | head -40                            # watch cgroup init

CgroupPlugin=autodetect
IgnoreSystemd=yes
